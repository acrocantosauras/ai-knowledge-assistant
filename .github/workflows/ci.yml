name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  backend-tests:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ai_knowledge_user
          POSTGRES_PASSWORD: ai_knowledge_password
          POSTGRES_DB: ai_knowledge_assistant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_knowledge_user -d ai_knowledge_assistant_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENVIRONMENT: test
      APP_DATABASE_URL: postgresql+asyncpg://ai_knowledge_user:ai_knowledge_password@localhost:5432/ai_knowledge_assistant_test
      APP_TEST_DATABASE_URL: postgresql+asyncpg://ai_knowledge_user:ai_knowledge_password@localhost:5432/ai_knowledge_assistant_test
      APP_JWT_SECRET_KEY: test-secret-key-for-ci-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -v --tb=short

  frontend-lint:
    name: Frontend Lint (oxlint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  frontend-typecheck:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  frontend-tests:
    name: Frontend Tests (vitest)
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-typecheck]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test

  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-typecheck]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  deploy-validate:
    name: Docker Build, Compose Validation and Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    env:
      POSTGRES_PASSWORD: ci-postgres-password-0123456789
      APP_JWT_SECRET_KEY: ci-jwt-secret-key-0123456789-0123456789-abcdef
      APP_METRICS_TOKEN: ci-metrics-token-0123456789
      APP_CORS_ORIGINS: '["http://localhost:8000"]'
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
      - name: Prod config must fail without secrets
        run: |
          env -u POSTGRES_PASSWORD -u APP_JWT_SECRET_KEY             docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q && exit 1 || true
      - name: Build and start production stack (runs migrations)
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --wait
      - name: Smoke test
        run: METRICS_TOKEN=$APP_METRICS_TOKEN bash scripts/smoke-test.sh
      - name: Restart recovery
        run: |
          docker compose restart api
          for i in $(seq 1 30); do
            curl -fsS localhost:8000/health/ready && exit 0; sleep 2
          done
          exit 1
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - run: docker compose down -v
        if: always()
