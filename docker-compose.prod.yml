# Production override. Use with:
#   docker compose --env-file .env.production \
#     -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# - Requires POSTGRES_PASSWORD and APP_JWT_SECRET_KEY (no defaults).
# - Postgres and Redis are NOT published to the host.
# - Migrations run in the one-shot `migrate` service before the API starts.

services:
  api:
    environment:
      APP_ENVIRONMENT: production
      APP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ai_knowledge_user}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_knowledge_assistant}
      APP_JWT_SECRET_KEY: ${APP_JWT_SECRET_KEY:?set APP_JWT_SECRET_KEY}
      APP_REDIS_URL: redis://redis:6379/0
      APP_METRICS_TOKEN: ${APP_METRICS_TOKEN:?set APP_METRICS_TOKEN}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:?set APP_CORS_ORIGINS to a JSON list}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  migrate:
    environment:
      APP_ENVIRONMENT: production
      APP_METRICS_TOKEN: ${APP_METRICS_TOKEN:?set APP_METRICS_TOKEN}
      APP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ai_knowledge_user}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_knowledge_assistant}
      APP_JWT_SECRET_KEY: ${APP_JWT_SECRET_KEY:?set APP_JWT_SECRET_KEY}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:?set APP_CORS_ORIGINS to a JSON list}

  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports: !reset []
    restart: unless-stopped

  redis:
    ports: !reset []
    restart: unless-stopped
