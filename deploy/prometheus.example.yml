# Prometheus scrape config. Put the value of APP_METRICS_TOKEN in the
# credentials file (chmod 600); never inline it in this file.
scrape_configs:
  - job_name: ai-knowledge-assistant
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/aika_metrics_token
    static_configs:
      - targets: ["api:8000"]   # private network address, not the public URL
