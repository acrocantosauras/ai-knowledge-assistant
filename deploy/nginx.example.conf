# Example TLS-terminating reverse proxy for AI Knowledge Assistant.
# TLS is NOT handled by the application; terminate it here (or at a cloud LB).
# Adjust server_name, certificate paths and the upstream address.

upstream aika_api {
    server 127.0.0.1:8000;          # or the api container address
}

server {
    listen 80;
    server_name your-domain.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.example;

    ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 11m;       # app limit is 10 MB per upload

    # /metrics must NOT be reachable from the internet. The app additionally
    # requires "Authorization: Bearer $APP_METRICS_TOKEN" (defence in depth).
    location = /metrics {
        allow 10.0.0.0/8;           # your monitoring network / Prometheus host
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://aika_api;
    }

    # Server-Sent Events: no buffering, long read timeout
    location /api/v1/qa/ask/stream {
        proxy_pass http://aika_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://aika_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
